# ==============================================================================
# Render Blueprint Specification (render.yaml)
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Express Backend REST API Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: prarthana-portfolio-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        sync: false
        # Set in Render dashboard to your frontend URL:
        # e.g., https://prarthana-portfolio-frontend.onrender.com
      - key: SUPABASE_URL
        sync: false
        # Paste your Supabase Project URL from Supabase Settings -> API
      - key: SUPABASE_ANON_KEY
        sync: false
        # Paste your Supabase Anon Key from Supabase Settings -> API

  # ----------------------------------------------------------------------------
  # 2. React + Vite Frontend Static Site
  # ----------------------------------------------------------------------------
  - type: web
    name: prarthana-portfolio-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      # Single Page Application (SPA) routing fallback
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
        # Set to your backend web service URL:
        # e.g., https://prarthana-portfolio-api.onrender.com
