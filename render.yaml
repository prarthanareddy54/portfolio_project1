version: "1"

services:
  # ----------------------------------------------------------------------------
  # 1. Express Backend REST API Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: prarthana-portfolio-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false

  # ----------------------------------------------------------------------------
  # 2. React + Vite Frontend Static Site
  # ----------------------------------------------------------------------------
  - type: web
    name: prarthana-portfolio-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    routes:
      # Single Page Application (SPA) routing fallback for React Router
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Security & caching headers
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    envVars:
      # Automatically references the live URL of your backend web service
      - key: VITE_API_URL
        fromService:
          name: prarthana-portfolio-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
